name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Create fresh Flutter project
        run: |
          flutter create --org com.territory --project-name territory_footprint .
          mkdir -p lib_bak
          cp -r lib/* lib_bak/ 2>/dev/null || true
          flutter create --org com.territory --project-name territory_footprint .
          cp -r lib_bak/* lib/ 2>/dev/null || true
          rm -rf lib_bak
      
      - run: flutter pub get
      
      - run: flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk