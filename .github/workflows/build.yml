name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Fix Android v1 embedding
        run: |
          rm -rf android/app/src/main/java/io/flutter
          sed -i 's/override fun registerWith/\/\/override fun registerWith/g' android/app/src/main/**/MainActivity.kt 2>/dev/null || true
      
      - run: flutter clean
      
      - run: flutter pub get
      
      - run: flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk